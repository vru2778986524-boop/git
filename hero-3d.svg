<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="sphereBlue" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="spherePink" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="sphereCyan" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
  </defs>
  <g opacity=".82">
    <!-- big isometric cube -->
    <polygon points="260,150 360,100 460,150 360,200" fill="url(#blue)"/>
    <polygon points="260,150 360,200 360,310 260,260" fill="#0284c7"/>
    <polygon points="360,200 460,150 460,260 360,310" fill="#0ea5e9"/>
    <!-- pink sphere -->
    <circle cx="620" cy="150" r="72" fill="url(#spherePink)"/>
    <!-- cyan sphere small -->
    <circle cx="120" cy="430" r="48" fill="url(#sphereCyan)"/>
    <!-- blue sphere large -->
    <circle cx="690" cy="430" r="90" fill="url(#sphereBlue)"/>
    <!-- cylinder -->
    <ellipse cx="420" cy="500" rx="100" ry="34" fill="url(#blue)"/>
    <path d="M320,500 L320,420 A100,34 0 0 1 520,420 L520,500 A100,34 0 0 1 320,500 Z" fill="#38bdf8" opacity=".85"/>
    <ellipse cx="420" cy="420" rx="100" ry="34" fill="#7dd3fc"/>
    <!-- small cubes random -->
    <g>
      <polygon points="180,90 230,65 280,90 230,115" fill="url(#pink)"/>
      <polygon points="180,90 230,115 230,165 180,140" fill="#db2777"/>
      <polygon points="230,115 280,90 280,140 230,165" fill="#f472b6"/>
    </g>
    <g>
      <polygon points="80,220 120,200 160,220 120,240" fill="url(#blue)"/>
      <polygon points="80,220 120,240 120,292 80,272" fill="#0369a1"/>
      <polygon points="120,240 160,220 160,272 120,292" fill="#38bdf8"/>
    </g>
    <g>
      <polygon points="540,300 580,280 620,300 580,320" fill="url(#pink)"/>
      <polygon points="540,300 580,320 580,372 540,352" fill="#be185d"/>
      <polygon points="580,320 620,300 620,352 580,372" fill="#ec4899"/>
    </g>
    <!-- cone -->
    <g>
      <polygon points="60,540 110,470 160,540" fill="url(#blue)"/>
      <ellipse cx="110" cy="540" rx="50" ry="12" fill="#0ea5e9"/>
    </g>
    <!-- floating ring -->
    <ellipse cx="300" cy="340" rx="130" ry="36" fill="none" stroke="url(#pink)" stroke-width="14" opacity=".75"/>
  </g>
</svg>