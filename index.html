<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄谷凡 - 个人简历</title>
<style>
/* ========== EDITORIAL CYBER · v4 ========== */
:root {
  --c-primary: #8b5cf6;
  --c-primary-light: #c4b5fd;
  --c-primary-dark: #6d28d9;
  --c-accent: #f472b6;
  --c-accent-light: #fbcfe8;
  --c-cyan: #22d3ee;
  --c-bg: #05060c;
  --c-surface: rgba(255,255,255,.05);
  --c-surface-strong: rgba(10,12,24,.78);
  --c-text: #f1f2f8;
  --c-text-secondary: #9aa3b5;
  --c-border: rgba(255,255,255,.11);
  --c-border-light: rgba(255,255,255,.06);
  --c-shadow: 0 14px 40px rgba(0,0,0,.38);
  --c-shadow-lg: 0 24px 70px rgba(0,0,0,.5);
  --c-shadow-xl: 0 32px 90px rgba(0,0,0,.6);
  --c-gradient-hero: linear-gradient(125deg, #0b1020 0%, #1e1445 42%, #3b0f3a 100%);
  --c-gradient-card: linear-gradient(145deg, rgba(139,92,246,.18), rgba(244,114,182,.07));
  --c-gradient-border: linear-gradient(135deg, rgba(139,92,246,.85), rgba(244,114,182,.65), rgba(34,211,238,.55));
  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 28px;
  --transition: 300ms cubic-bezier(.22,1,.36,1);
  --max-width: 1180px;
  --nav-height: 68px;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
  color-scheme: dark;
}

[data-theme="light"] {
  --c-primary: #7c3aed;
  --c-primary-light: #a78bfa;
  --c-primary-dark: #5b21b6;
  --c-accent: #db2777;
  --c-accent-light: #f472b6;
  --c-cyan: #0891b2;
  --c-bg: #f4f1fb;
  --c-surface: rgba(255,255,255,.74);
  --c-surface-strong: rgba(255,255,255,.88);
  --c-text: #171523;
  --c-text-secondary: #57536b;
  --c-border: rgba(23,21,35,.10);
  --c-border-light: rgba(23,21,35,.06);
  --c-shadow: 0 14px 40px rgba(76,29,149,.12);
  --c-shadow-lg: 0 24px 70px rgba(76,29,149,.18);
  --c-shadow-xl: 0 32px 90px rgba(76,29,149,.22);
  --c-gradient-hero: linear-gradient(125deg, #e0e7ff 0%, #f5d0fe 48%, #fce7f3 100%);
  --c-gradient-card: linear-gradient(145deg, rgba(124,58,237,.10), rgba(219,39,119,.05));
  --c-gradient-border: linear-gradient(135deg, rgba(124,58,237,.65), rgba(219,39,119,.5), rgba(8,145,178,.45));
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + 24px);
  background: var(--c-bg);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(1100px 700px at 12% -5%, rgba(139,92,246,.26), transparent 55%),
    radial-gradient(1000px 650px at 90% 18%, rgba(244,114,182,.18), transparent 50%),
    radial-gradient(900px 800px at 50% 115%, rgba(34,211,238,.14), transparent 55%),
    conic-gradient(from 200deg at 50% 50%, rgba(139,92,246,.06), transparent 30%, rgba(244,114,182,.06), transparent 70%),
    var(--c-bg);
  color: var(--c-text);
  line-height: 1.8;
  transition: background var(--transition), color var(--transition);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  counter-reset: section 0;
}

[data-theme="light"] body {
  background:
    radial-gradient(1100px 700px at 12% -5%, rgba(124,58,237,.14), transparent 55%),
    radial-gradient(1000px 650px at 90% 18%, rgba(219,39,119,.10), transparent 50%),
    radial-gradient(900px 800px at 50% 115%, rgba(8,145,178,.09), transparent 55%),
    conic-gradient(from 200deg at 50% 50%, rgba(124,58,237,.04), transparent 30%, rgba(219,39,119,.04), transparent 70%),
    var(--c-bg);
}

/* Perspective cyber grid */
body::before {
  content: "";
  position: fixed;
  left: -10%;
  right: -10%;
  top: 0;
  height: 120vh;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 56px 56px;
  transform: perspective(700px) rotateX(58deg) scale(1.6);
  transform-origin: 50% 0%;
  mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
}

[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(23,21,35,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23,21,35,.05) 1px, transparent 1px);
}

/* Aurora blobs */
body::after {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 22% 28%, rgba(139,92,246,.18), transparent 34%),
    radial-gradient(circle at 78% 62%, rgba(244,114,182,.15), transparent 36%),
    radial-gradient(circle at 50% 95%, rgba(34,211,238,.12), transparent 34%);
  filter: blur(70px);
  animation: auroraDrift 20s ease-in-out infinite alternate;
}

@keyframes auroraDrift {
  0% { transform: translate3d(-2%, -1%, 0) rotate(0deg) scale(1); }
  100% { transform: translate3d(3%, 2%, 0) rotate(2deg) scale(1.08); }
}

#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .45;
}

[data-theme="dark"] #bgCanvas { opacity: .55; }
[data-theme="light"] #bgCanvas { opacity: .25; }

/* ========== Global overlays ========== */
.noise-overlay {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  opacity: .06;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

[data-theme="light"] .noise-overlay {
  opacity: .04;
  mix-blend-mode: multiply;
}

.cursor-spotlight {
  position: fixed;
  left: 0;
  top: 0;
  width: 700px;
  height: 700px;
  z-index: 2;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,.15), rgba(244,114,182,.06) 40%, transparent 68%);
  opacity: 0;
  transition: opacity .4s ease;
  will-change: transform;
}

body:hover .cursor-spotlight { opacity: 1; }

@media (hover: none), (pointer: coarse) {
  .cursor-spotlight { display: none; }
}

.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 10000;
  background: linear-gradient(90deg, var(--c-primary), var(--c-accent), var(--c-cyan));
  box-shadow: 0 0 16px rgba(139,92,246,.5);
  transform-origin: 0 50%;
  transform: scaleX(0);
  pointer-events: none;
}

/* ========== Navbar ========== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: rgba(5,6,12,.6);
  border-bottom: 1px solid rgba(255,255,255,.08);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  transition: background var(--transition), border-color var(--transition);
}

[data-theme="light"] .nav {
  background: rgba(255,255,255,.72);
  border-bottom: 1px solid rgba(23,21,35,.08);
}

.nav-inner {
  width: 100%;
  max-width: var(--max-width);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-logo {
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: -.04em;
  text-decoration: none;
  background: linear-gradient(135deg, var(--c-primary-light), var(--c-accent-light));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap;
  position: relative;
}

.nav-logo::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--c-primary), transparent);
  border-radius: 2px;
}

.nav-links {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.nav-links a {
  text-decoration: none;
  color: var(--c-text-secondary);
  font-size: .86rem;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 999px;
  transition: all var(--transition);
  white-space: nowrap;
  position: relative;
}

.nav-links a:hover,
.nav-links a:focus-visible {
  color: var(--c-text);
  background: rgba(139,92,246,.14);
  box-shadow: inset 0 0 0 1px rgba(139,92,246,.28);
}

.nav-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.nav-btn {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--c-border);
  color: var(--c-text);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: .85rem;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 5px;
}

[data-theme="light"] .nav-btn { background: rgba(23,21,35,.04); }

.nav-btn:hover {
  border-color: rgba(139,92,246,.55);
  color: var(--c-text);
  background: rgba(139,92,246,.12);
  box-shadow: 0 0 20px rgba(139,92,246,.18);
}

.nav-btn svg { width: 16px; height: 16px; }

/* ========== Hero: keep split avatar, make it bigger ========== */
.hero {
  min-height: 100svh;
  padding: calc(var(--nav-height) + 64px) 28px 80px;
  display: flex;
  align-items: center;
  background: var(--c-gradient-hero);
  color: #fff;
  position: relative;
  overflow: hidden;
}

[data-theme="light"] .hero { color: var(--c-text); }

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 45%, rgba(139,92,246,.3), transparent 55%),
    radial-gradient(ellipse at 85% 18%, rgba(244,114,182,.22), transparent 45%),
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: auto, auto, 52px 52px, 52px 52px;
  mask-image: radial-gradient(ellipse at 55% 50%, #000 5%, transparent 82%);
  -webkit-mask-image: radial-gradient(ellipse at 55% 50%, #000 5%, transparent 82%);
  pointer-events: none;
}

[data-theme="light"] .hero::before {
  background:
    radial-gradient(ellipse at 20% 45%, rgba(124,58,237,.16), transparent 55%),
    radial-gradient(ellipse at 85% 18%, rgba(219,39,119,.12), transparent 45%),
    linear-gradient(rgba(23,21,35,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(23,21,35,.05) 1px, transparent 1px);
  background-size: auto, auto, 52px 52px, 52px 52px;
}

.hero-inner {
  position: relative;
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: clamp(36px, 7vw, 84px);
  align-items: center;
  text-align: left;
}

.hero-avatar {
  width: 100%;
  max-width: 300px;
  aspect-ratio: 4 / 5;
  border-radius: 32px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.24);
  background: rgba(255,255,255,.06);
  box-shadow:
    0 36px 90px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.1),
    0 0 80px rgba(139,92,246,.32);
  transform: rotate(-2.5deg);
  transition: transform var(--transition), box-shadow var(--transition);
  position: relative;
}

.hero-avatar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,.14), transparent 40%);
  pointer-events: none;
}

.hero-avatar:hover {
  transform: rotate(0deg) translateY(-6px);
  box-shadow:
    0 44px 100px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.16),
    0 0 110px rgba(139,92,246,.45);
}

[data-theme="light"] .hero-avatar {
  border-color: rgba(23,21,35,.14);
  box-shadow: 0 30px 70px rgba(76,29,149,.2), 0 0 60px rgba(124,58,237,.18);
}

.hero-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero h1 {
  font-size: clamp(3.2rem, 8vw, 6.2rem);
  font-weight: 900;
  letter-spacing: -.07em;
  line-height: .95;
  margin-bottom: 16px;
  text-shadow: 0 14px 50px rgba(0,0,0,.3);
}

.hero .subtitle {
  font-size: clamp(1.05rem, 2vw, 1.3rem);
  opacity: .88;
  max-width: 640px;
  margin-bottom: 22px;
  font-weight: 500;
}

.hero .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 32px;
}

.hero .tag {
  padding: 7px 18px;
  border-radius: 999px;
  font-size: .84rem;
  font-weight: 600;
  background: rgba(255,255,255,.14);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.24);
  color: #fff;
}

[data-theme="light"] .hero .tag {
  background: rgba(255,255,255,.55);
  border-color: rgba(23,21,35,.10);
  color: var(--c-text);
}

.hero .contact-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.hero .contact-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 12px 28px;
  border-radius: 999px;
  font-size: .94rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
}

.hero .contact-btn-primary {
  background: #fff;
  color: #5b21b6;
  box-shadow: 0 12px 36px rgba(0,0,0,.2);
}

.hero .contact-btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 44px rgba(0,0,0,.28), 0 0 34px rgba(255,255,255,.28);
}

[data-theme="light"] .hero .contact-btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
}

.hero .contact-btn-outline {
  background: rgba(255,255,255,.08);
  color: #fff;
  border: 1px solid rgba(255,255,255,.42);
}

.hero .contact-btn-outline:hover {
  background: rgba(255,255,255,.16);
  border-color: #fff;
  transform: translateY(-3px);
}

[data-theme="light"] .hero .contact-btn-outline {
  background: rgba(255,255,255,.5);
  color: var(--c-text);
  border-color: rgba(23,21,35,.16);
}

/* ========== Section Common ========== */
.section {
  padding: 110px 28px;
  position: relative;
  z-index: 1;
  counter-increment: section;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.section:nth-of-type(even) {
  background:
    radial-gradient(900px 500px at 90% 10%, rgba(139,92,246,.07), transparent 55%),
    radial-gradient(700px 400px at 10% 90%, rgba(244,114,182,.05), transparent 55%);
}

[data-theme="light"] .section:nth-of-type(even) {
  background:
    radial-gradient(900px 500px at 90% 10%, rgba(124,58,237,.06), transparent 55%),
    radial-gradient(700px 400px at 10% 90%, rgba(219,39,119,.04), transparent 55%);
}

main, header, footer, nav { position: relative; z-index: 1; }

.section-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  position: relative;
}

.section-title {
  font-size: clamp(2rem, 5vw, 3.4rem);
  font-weight: 900;
  letter-spacing: -.045em;
  margin-bottom: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  isolation: isolate;
}

.section-title::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 40px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--c-primary), var(--c-accent));
  box-shadow: 0 0 24px rgba(139,92,246,.55);
  flex-shrink: 0;
}

.section-title::after {
  content: "0" counter(section);
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-54%);
  font-family: var(--font-mono);
  font-size: clamp(4.5rem, 13vw, 10rem);
  font-weight: 900;
  letter-spacing: -.07em;
  color: transparent;
  -webkit-text-stroke: 1px rgba(139,92,246,.42);
  opacity: .16;
  z-index: -1;
  pointer-events: none;
  line-height: 1;
}

[data-theme="light"] .section-title::after {
  -webkit-text-stroke: 1px rgba(124,58,237,.5);
  opacity: .18;
}

/* ========== Highlights: true 12-col bento ========== */
.highlights-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 104px;
  gap: 20px;
}

.highlight-card {
  background:
    linear-gradient(var(--c-surface-strong), var(--c-surface-strong)) padding-box,
    var(--c-gradient-border) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: 26px 24px;
  text-align: left;
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--c-shadow);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  --mx: 50%;
  --my: 50%;
}

.highlight-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,.14), transparent 42%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
  z-index: 1;
}

.highlight-card::after {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(244,114,182,.18), transparent 70%);
  opacity: 0;
  transition: opacity var(--transition);
}

.highlight-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--c-shadow-lg), 0 0 50px rgba(139,92,246,.18);
}

.highlight-card:hover::before,
.highlight-card:hover::after { opacity: 1; }

.highlight-card .icon {
  font-size: 2.4rem;
  margin-bottom: auto;
  line-height: 1;
  filter: drop-shadow(0 8px 16px rgba(139,92,246,.35));
  position: relative;
  z-index: 2;
}

.highlight-card .number {
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--c-primary-light);
  line-height: 1.1;
  letter-spacing: -.03em;
  margin-top: 8px;
  position: relative;
  z-index: 2;
}

[data-theme="light"] .highlight-card .number { color: var(--c-primary); }

.highlight-card .label {
  font-size: .86rem;
  color: var(--c-text-secondary);
  margin-top: 4px;
  position: relative;
  z-index: 2;
}

.highlight-card:nth-child(1) {
  grid-column: span 7;
  grid-row: span 2;
  padding: 34px;
}

.highlight-card:nth-child(1) .icon { font-size: 3.4rem; }
.highlight-card:nth-child(1) .number { font-size: 3rem; }
.highlight-card:nth-child(1) .label { font-size: 1rem; }

.highlight-card:nth-child(2) {
  grid-column: span 5;
  grid-row: span 1;
}

.highlight-card:nth-child(3) {
  grid-column: span 5;
  grid-row: span 1;
}

.highlight-card:nth-child(4) {
  grid-column: span 12;
  grid-row: span 1;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
}

.highlight-card:nth-child(4) .icon { margin-bottom: 0; }
.highlight-card:nth-child(4) .number { margin-top: 0; }
.highlight-card:nth-child(4) .label { margin-top: 0; }

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 11px 24px;
  font-size: .9rem;
  font-weight: 700;
  border: 1px solid var(--c-border);
  background: var(--c-surface);
  color: var(--c-text-secondary);
  cursor: pointer;
  border-radius: 999px;
  transition: all var(--transition);
}

.tab-btn:hover {
  color: var(--c-text);
  border-color: rgba(139,92,246,.5);
  background: rgba(139,92,246,.10);
  transform: translateY(-1px);
}

.tab-btn[aria-selected="true"] {
  color: #fff;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  border-color: transparent;
  box-shadow: 0 12px 34px rgba(139,92,246,.4);
}

[data-theme="light"] .tab-btn[aria-selected="true"] { color: #fff; }

.tab-panel { display: none; }
.tab-panel[aria-hidden="false"] { display: block; }

/* ========== Timeline: editorial spotlight card ========== */
.timeline {
  position: relative;
  display: grid;
  gap: 22px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  background: linear-gradient(to bottom, transparent, var(--c-primary), var(--c-accent), transparent);
  border-radius: 3px;
  opacity: .8;
}

.timeline-item {
  position: relative;
  padding-left: 64px;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 18px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--c-primary);
  border: 4px solid var(--c-bg);
  box-shadow: 0 0 0 6px rgba(139,92,246,.18), 0 0 30px rgba(139,92,246,.7);
  z-index: 1;
}

.timeline-card {
  background:
    linear-gradient(var(--c-surface-strong), var(--c-surface-strong)) padding-box,
    var(--c-gradient-border) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: 34px 36px 30px 40px;
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--c-shadow);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  --mx: 50%;
  --my: 50%;
}

.timeline-card::before {
  content: "● ● ●";
  position: absolute;
  top: 18px;
  right: 22px;
  font-family: var(--font-mono);
  font-size: .6rem;
  letter-spacing: .25em;
  color: rgba(139,92,246,.55);
}

.timeline-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,.12), transparent 42%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}

.timeline-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--c-shadow-lg), 0 0 50px rgba(139,92,246,.18);
}

.timeline-card:hover::after { opacity: 1; }

.timeline-card h3 {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--c-text), var(--c-primary-light));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.timeline-card .meta {
  font-size: .88rem;
  color: var(--c-text-secondary);
  margin-bottom: 16px;
  font-family: var(--font-mono);
}

.timeline-card ul {
  list-style: none;
  padding: 0;
}

.timeline-card li {
  position: relative;
  padding-left: 22px;
  margin-bottom: 8px;
  font-size: .94rem;
  color: var(--c-text-secondary);
}

.timeline-card li::before {
  content: "▸";
  position: absolute;
  left: 0;
  color: var(--c-accent);
  font-size: .85rem;
  top: 2px;
}

.empty-state {
  text-align: center;
  padding: 48px;
  color: var(--c-text-secondary);
  font-size: .92rem;
  background: var(--c-surface);
  border: 1px dashed var(--c-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(12px);
}

/* ========== Skills & Projects ========== */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 26px;
}

.skill-card {
  background:
    linear-gradient(var(--c-surface-strong), var(--c-surface-strong)) padding-box,
    var(--c-gradient-border) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: 32px;
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--c-shadow);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  --mx: 50%;
  --my: 50%;
}

.skill-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
  opacity: .4;
  pointer-events: none;
}

.skill-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,.13), transparent 42%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}

.skill-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--c-shadow-lg), 0 0 55px rgba(139,92,246,.2);
}

.skill-card:hover::after { opacity: 1; }

.skill-card h4 {
  font-size: 1.15rem;
  font-weight: 900;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.skill-card h4 .skill-icon {
  font-size: 1.6rem;
  filter: drop-shadow(0 6px 14px rgba(139,92,246,.45));
}

.skill-bars { display: flex; flex-direction: column; gap: 16px; }
.skill-bar-item { }
.skill-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: .86rem;
  margin-bottom: 6px;
  color: var(--c-text-secondary);
}

.skill-bar-track {
  height: 11px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
  position: relative;
}

[data-theme="light"] .skill-bar-track { background: rgba(23,21,35,.08); }

.skill-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--c-primary), var(--c-accent), var(--c-cyan));
  background-size: 200% 100%;
  box-shadow: 0 0 20px rgba(139,92,246,.55);
  transition: width 900ms cubic-bezier(.22,1,.36,1);
}

.skill-bar-fill:hover { animation: barShine 1.2s linear infinite; }

@keyframes barShine {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.skill-tag {
  padding: 6px 15px;
  border-radius: 999px;
  font-size: .81rem;
  background: var(--c-surface);
  color: var(--c-text);
  font-weight: 600;
  border: 1px solid var(--c-border);
  transition: all var(--transition);
}

.skill-tag:hover {
  border-color: rgba(139,92,246,.5);
  transform: translateY(-1px);
}

.skill-tag.level-high {
  background: rgba(139,92,246,.15);
  color: var(--c-primary-light);
  border-color: rgba(139,92,246,.3);
}

.skill-tag.level-mid {
  background: rgba(244,114,182,.13);
  color: var(--c-accent-light);
  border-color: rgba(244,114,182,.28);
}

.skill-tag.level-base {
  background: rgba(148,163,184,.12);
  color: var(--c-text-secondary);
  border-color: var(--c-border);
}

[data-theme="light"] .skill-tag.level-high {
  background: #ede9fe;
  color: #6d28d9;
  border-color: #ddd6fe;
}

[data-theme="light"] .skill-tag.level-mid {
  background: #fce7f3;
  color: #be185d;
  border-color: #fbcfe8;
}

[data-theme="light"] .skill-tag.level-base {
  background: #f1f5f9;
  color: #475569;
  border-color: #e2e8f0;
}

/* Projects: numbered launch cards */
#projPanels .skills-grid {
  grid-template-columns: repeat(3, 1fr);
}

#projPanels .skill-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  counter-increment: project;
}

#projPanels .skill-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,.13), transparent 42%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}

#projPanels .skill-card:hover::after { opacity: 1; }

#projPanels .skill-card h4 {
  font-size: 1.4rem;
  margin-bottom: 0;
  position: relative;
  padding-left: 56px;
}

#projPanels .skill-card h4::before {
  content: "0" counter(project);
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 1.9rem;
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px rgba(139,92,246,.7);
  line-height: 1;
}

#projPanels .skill-card p {
  flex: 1;
  margin-top: 0 !important;
}

#projPanels .skill-card a {
  align-self: flex-start;
  padding: 10px 22px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff !important;
  box-shadow: 0 10px 28px rgba(139,92,246,.35);
  transition: all var(--transition);
}

#projPanels .skill-card a:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(139,92,246,.5);
}

/* ========== Edu & Cert ========== */
.edu-cert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 26px;
}

.cert-card {
  background:
    linear-gradient(var(--c-surface-strong), var(--c-surface-strong)) padding-box,
    var(--c-gradient-border) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: 32px;
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--c-shadow);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  --mx: 50%;
  --my: 50%;
}

.cert-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px circle at var(--mx) var(--my), rgba(255,255,255,.13), transparent 42%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}

.cert-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--c-shadow-lg), 0 0 50px rgba(139,92,246,.18);
}

.cert-card:hover::after { opacity: 1; }

.cert-card .cert-badge {
  display: inline-block;
  padding: 7px 18px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .05em;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 10px 26px rgba(139,92,246,.35);
}

.cert-card h4 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; }
.cert-card .cert-date { font-size: .84rem; color: var(--c-text-secondary); margin-bottom: 12px; font-family: var(--font-mono); }
.cert-card .cert-desc { font-size: .88rem; color: var(--c-text-secondary); line-height: 1.8; }

/* Cert gallery: dense collage */
.cert-images {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-flow: dense;
  gap: 16px;
  margin-top: 28px;
}

.cert-images img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 6px;
  border: 6px solid #fff;
  border-bottom-width: 28px;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 18px 44px rgba(0,0,0,.42);
  transition: all var(--transition);
  filter: saturate(.9) contrast(1.03);
}

.cert-images img:nth-child(1) { grid-column: span 2; grid-row: span 2; }
.cert-images img:nth-child(2) { grid-column: span 1; grid-row: span 1; transform: rotate(2deg); }
.cert-images img:nth-child(3) { grid-column: span 1; grid-row: span 1; transform: rotate(-1.5deg); }
.cert-images img:nth-child(4) { grid-column: span 1; grid-row: span 1; transform: rotate(1deg); }
.cert-images img:nth-child(5) { grid-column: span 1; grid-row: span 1; transform: rotate(-2deg); }
.cert-images img:nth-child(6) { grid-column: span 1; grid-row: span 1; transform: rotate(2.5deg); }
.cert-images img:nth-child(7) { grid-column: span 2; grid-row: span 1; transform: rotate(-1deg); }
.cert-images img:nth-child(8) { grid-column: span 1; grid-row: span 1; transform: rotate(1.5deg); }

.cert-images img:hover {
  transform: rotate(0deg) translateY(-8px) scale(1.04) !important;
  box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 50px rgba(139,92,246,.22);
  filter: saturate(1.05) contrast(1.05);
  z-index: 5;
}

[data-theme="light"] .cert-images img { box-shadow: 0 16px 40px rgba(76,29,149,.16); }

/* ========== Lightbox ========== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(3,5,12,.92);
  backdrop-filter: blur(18px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease;
}

.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 18px;
  box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 70px rgba(139,92,246,.2);
  transform: scale(.92);
  transition: transform 250ms ease;
}

.lightbox.open img { transform: scale(1); }

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), transform var(--transition);
}

.lightbox-close:hover {
  background: rgba(255,255,255,.2);
  transform: rotate(90deg);
}

/* ========== Footer ========== */
.footer {
  text-align: center;
  padding: 52px 28px;
  border-top: 1px solid var(--c-border);
  color: var(--c-text-secondary);
  font-size: .84rem;
  background: rgba(5,6,12,.5);
  backdrop-filter: blur(14px);
}

[data-theme="light"] .footer { background: rgba(255,255,255,.5); }

.footer .personal-note {
  max-width: 720px;
  margin: 18px auto 0;
  font-style: italic;
  line-height: 1.85;
}

/* ========== Back to Top ========== */
.back-to-top {
  position: fixed;
  bottom: 26px;
  right: 26px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 14px 36px rgba(139,92,246,.4);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: all var(--transition);
  z-index: 999;
}

.back-to-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.back-to-top:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 44px rgba(139,92,246,.55);
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 88px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--c-surface-strong);
  color: var(--c-text);
  padding: 12px 28px;
  border-radius: 999px;
  font-size: .86rem;
  border: 1px solid var(--c-border);
  backdrop-filter: blur(16px);
  box-shadow: var(--c-shadow-lg);
  z-index: 9999;
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}

.toast.show { opacity: 1; }

/* ========== Animations ========== */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 560ms ease, transform 560ms cubic-bezier(.22,1,.36,1);
}

.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

@supports (animation-timeline: view()) {
  .section-title {
    animation: titleReveal linear both;
    animation-timeline: view();
    animation-range: entry 0% cover 28%;
  }
}

@keyframes titleReveal {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
  html { scroll-behavior: auto; }
  #bgCanvas { display: none; }
}

/* ========== Responsive ========== */
@media (max-width: 960px) {
  .hero-inner {
    grid-template-columns: 1fr;
    text-align: center;
    justify-items: center;
  }
  .hero-avatar { max-width: 230px; }
  .hero .tags,
  .hero .contact-row { justify-content: center; }
  .highlights-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: auto; }
  .highlight-card:nth-child(1),
  .highlight-card:nth-child(2),
  .highlight-card:nth-child(3),
  .highlight-card:nth-child(4) {
    grid-column: auto;
    grid-row: auto;
    display: flex;
  }
  .highlight-card:nth-child(1) .number { font-size: 2.4rem; }
  .highlight-card:nth-child(1) .icon { font-size: 2.8rem; }
  #projPanels .skills-grid { grid-template-columns: 1fr; }
  .cert-images { grid-template-columns: repeat(2, 1fr); }
  .cert-images img:nth-child(1),
  .cert-images img:nth-child(7) { grid-column: span 2; grid-row: auto; }
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .hero { padding: calc(var(--nav-height) + 44px) 18px 64px; min-height: auto; }
  .hero h1 { font-size: 2.6rem; }
  .hero .subtitle { font-size: .98rem; }
  .section { padding: 72px 18px; }
  .section-title { font-size: 1.6rem; }
  .section-title::after { font-size: 4.5rem; opacity: .12; }
  .skills-grid { grid-template-columns: 1fr; }
  .edu-cert-grid { grid-template-columns: 1fr; }
  .tab-btn { padding: 9px 18px; font-size: .84rem; }
  .timeline-item { padding-left: 48px; }
  .timeline-card { padding: 24px; }
}

@media (max-width: 480px) {
  .highlights-grid { grid-template-columns: 1fr; }
  .hero-avatar { max-width: 190px; }
  .cert-images { grid-template-columns: 1fr 1fr; }
  .cert-images img:nth-child(1),
  .cert-images img:nth-child(7) { grid-column: span 2; }
}

/* ========== Print ========== */
@media print {
  .nav, .back-to-top, .toast, .nav-btn-print, #bgCanvas,
  .noise-overlay, .cursor-spotlight, .scroll-progress { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  body::before, body::after { display: none !important; }
  .hero { background: #fff !important; color: #000 !important; min-height: auto; padding: 40px 0 20px !important; }
  .hero-inner { grid-template-columns: 1fr !important; gap: 20px !important; text-align: left !important; }
  .hero .tag { background: #f1f5f9; color: #1e293b; border-color: #e2e8f0; }
  .hero .contact-btn-primary { background: var(--c-primary); color: #fff; }
  .hero .contact-btn-outline { border-color: var(--c-primary); color: var(--c-primary); }
  .hero::before { display: none; }
  .section { padding: 24px 0 !important; }
  .section-inner { max-width: 100%; }
  .highlight-card, .timeline-card, .skill-card, .cert-card { box-shadow: none !important; break-inside: avoid; background: #fff !important; border-color: #ddd !important; }
  .cert-images img { border-color: #fff !important; box-shadow: none !important; transform: none !important; }
  .fade-in { opacity: 1 !important; transform: none !important; }
  .back-to-top { display: none !important; }
}

/* ===== v4.1 Visible background overhaul ===== */
body::before,
body::after {
  display: none !important;
}

.bg-aurora {
  position: fixed;
  inset: 0;
  z-index: -1;

    radial-gradient(45% 40% at 15% 20%, rgba(124,58,237,.55), transparent 60%),

.bg-scanlines {

  opacity: .25;

}

.bg-aurora {

  filter: blur(32px) saturate(170%) !important;
}

.bg-grid {
  opacity: .7 !important;
}

.bg-scanlines {
  opacity: .7 !important;
}

/* Giant serif gradient typography */
.hero h1 {
  position: relative;
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  font-size: clamp(4rem, 14vw, 10rem) !important;
  letter-spacing: -.08em !important;
  line-height: .9 !important;
  background: linear-gradient(90deg, #a78bfa, #f472b6, #22d3ee, #a78bfa);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientText 6s linear infinite;
  filter: drop-shadow(0 0 26px rgba(139,92,246,.6)) drop-shadow(0 0 70px rgba(244,114,182,.35));
}

@keyframes gradientText {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.hero h1::before,
.hero h1::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.3);
  pointer-events: none;
  opacity: .55;
  z-index: -1;
}

.hero h1::before {
  transform: translate(3px, -3px);
  animation: glitchA 3.2s infinite steps(1);
}

.hero h1::after {
  transform: translate(-3px, 3px);
  animation: glitchB 2.7s infinite steps(1);
}

@keyframes glitchA {
  0%, 92% { clip-path: inset(0 0 0 0); transform: translate(3px, -3px); opacity: .5; }
  94% { clip-path: inset(20% 0 40% 0); transform: translate(-4px, 2px); opacity: .9; }
  96% { clip-path: inset(60% 0 10% 0); transform: translate(4px, -2px); opacity: .9; }
  98%, 100% { clip-path: inset(0 0 0 0); transform: translate(3px, -3px); opacity: .5; }
}

@keyframes glitchB {
  0%, 90% { clip-path: inset(0 0 0 0); transform: translate(-3px, 3px); opacity: .5; }
  93% { clip-path: inset(10% 0 60% 0); transform: translate(4px, -3px); opacity: .9; }
  95% { clip-path: inset(50% 0 20% 0); transform: translate(-4px, 3px); opacity: .9; }
  97%, 100% { clip-path: inset(0 0 0 0); transform: translate(-3px, 3px); opacity: .5; }
}

/* ===== Skill Matrix: new bento + segmented matrix bars ===== */
#skillsGrid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  align-items: stretch;
}

#skillsGrid .skill-card {
  grid-column: span 6;
  padding: 34px;
  border-radius: 30px;
  position: relative;
  overflow: hidden;
}

#skillsGrid .skill-card:first-child {
  grid-column: span 7;
}

#skillsGrid .skill-card:nth-child(2) {
  grid-column: span 5;
}

#skillsGrid .skill-card:last-child {
  grid-column: span 12;
}

#skillsGrid .skill-card:last-child .skill-bars {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px 32px;
}

#skillsGrid .skill-card::before {
  content: "";
  position: absolute;
  inset: 0;
  height: auto;
  background-image:
    linear-gradient(rgba(56,189,248,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(244,114,182,.08) 1px, transparent 1px);
  background-size: 26px 26px;
  opacity: .5;
  pointer-events: none;
}

#skillsGrid .skill-card h4 {
  font-size: 1.6rem !important;
  margin-bottom: 26px !important;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 14px;
}

#skillsGrid .skill-card h4 .skill-icon {
  font-size: 2rem;
  filter: drop-shadow(0 0 16px rgba(56,189,248,.5));
}

#skillsGrid .skill-bars {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

#skillsGrid .skill-bar-item {
  display: grid;
  grid-template-columns: 130px 1fr 52px;
  align-items: center;
  gap: 14px;
}

#skillsGrid .skill-bar-label {
  display: contents;
}

#skillsGrid .skill-bar-label span:first-child {
  font-size: .92rem;
  font-weight: 600;
  color: var(--c-text);
  white-space: nowrap;
}

#skillsGrid .skill-bar-label span:last-child {
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 800;
  color: #7dd3fc;
  text-align: right;
  text-shadow: 0 0 12px rgba(56,189,248,.6);
}

#skillsGrid .skill-bar-track {
  height: 18px;
  border-radius: 6px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 6px, transparent 6px 12px),
    rgba(255,255,255,.04);
  overflow: hidden;
  position: relative;
}

#skillsGrid .skill-bar-fill {
  border-radius: 6px;
  background: linear-gradient(90deg, #38bdf8, #f472b6);
  box-shadow: 0 0 16px rgba(56,189,248,.55), 0 0 32px rgba(244,114,182,.3);
}

@media (max-width: 900px) {
  #skillsGrid {
    grid-template-columns: 1fr;
  }
  #skillsGrid .skill-card,
  #skillsGrid .skill-card:first-child,
  #skillsGrid .skill-card:nth-child(2),
  #skillsGrid .skill-card:last-child {
    grid-column: span 1;
  }
  #skillsGrid .skill-card:last-child .skill-bars {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 560px) {

}

/* ===== Loader / splash ===== */
.loader {

  background: linear-gradient(135deg, #0b1120, #101a38, #0b1120);
  transition: opacity .55s ease, visibility .55s ease;
}

.loader.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-inner {
  text-align: center;
}

.loader-logo {
  font-family: "YouYuan", "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 2.6rem;
  font-weight: 900;
  color: #38bdf8;

}

.loader-bar {
  width: 200px;
  height: 7px;
  background: rgba(255,255,255,.1);
  border-radius: 999px;
  margin: 22px auto;
  overflow: hidden;
}

.loader-bar span {
  display: block;
  height: 100%;
  width: 40%;

  letter-spacing: .22em;
}

@keyframes loaderSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

@keyframes loaderPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

[data-theme="light"] .loader {

/* Pixel confetti */
.pixel-confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.pixel-confetti i {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 9px;
  background: #38bdf8;
  opacity: .75;
  animation: pixelFall linear infinite;
}

.pixel-confetti i:nth-child(3n) { background: #f472b6; }
.pixel-confetti i:nth-child(3n+1) { background: #22d3ee; }
.pixel-confetti i:nth-child(2n) { width: 6px; height: 6px; }

.pixel-confetti i:nth-child(1) { left: 8%; animation-duration: 3.2s; animation-delay: 0s; }
.pixel-confetti i:nth-child(2) { left: 18%; animation-duration: 4.1s; animation-delay: .3s; }
.pixel-confetti i:nth-child(3) { left: 29%; animation-duration: 3.6s; animation-delay: .8s; }
.pixel-confetti i:nth-child(4) { left: 41%; animation-duration: 4.4s; animation-delay: .2s; }
.pixel-confetti i:nth-child(5) { left: 53%; animation-duration: 3.4s; animation-delay: 1.1s; }
.pixel-confetti i:nth-child(6) { left: 64%; animation-duration: 4s; animation-delay: .5s; }
.pixel-confetti i:nth-child(7) { left: 73%; animation-duration: 3.8s; animation-delay: 1.4s; }
.pixel-confetti i:nth-child(8) { left: 82%; animation-duration: 4.2s; animation-delay: .7s; }
.pixel-confetti i:nth-child(9) { left: 90%; animation-duration: 3.5s; animation-delay: 1.7s; }
.pixel-confetti i:nth-child(10) { left: 12%; animation-duration: 4.6s; animation-delay: 2s; }
.pixel-confetti i:nth-child(11) { left: 47%; animation-duration: 3.9s; animation-delay: 2.3s; }
.pixel-confetti i:nth-child(12) { left: 68%; animation-duration: 4.3s; animation-delay: 2.6s; }

@keyframes pixelFall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* ========== DOM Helpers ========== */
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "className") e.className = v;
    else if (k === "innerHTML") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  const append = (c) => {
    if (Array.isArray(c)) c.forEach(append);
    else if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c instanceof Node) e.appendChild(c);
  };
  children.forEach(append);
  return e;
}

/* ========== Tab Logic ========== */
function switchTab(prefix, key) {
  const tabs = $$(".tab-btn", $("#" + prefix + "Tabs"));
  const panels = $$(".tab-panel", $("#" + prefix + "Panels"));
  const tabId = prefix + "-tab-" + key;
  const panelId = prefix + "-panel-" + key;

  tabs.forEach(t => {
    t.setAttribute("aria-selected", t.id === tabId ? "true" : "false");
    t.tabIndex = t.id === tabId ? "0" : "-1";
  });
  panels.forEach(p => {
    p.setAttribute("aria-hidden", p.id === panelId ? "false" : "true");
  });
}

function handleTabKey(e, prefix, currentKey) {
  const tabs = $$(".tab-btn", $("#" + prefix + "Tabs"));
  const keys = Object.keys(prefix === "exp" ? resume.experience : resume.projects);
  const idx = keys.indexOf(currentKey);
  let newIdx = idx;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    if (e.key === "ArrowRight") newIdx = (idx + 1) % keys.length;
    else newIdx = (idx - 1 + keys.length) % keys.length;
    switchTab(prefix, keys[newIdx]);
    tabs[newIdx].focus();
  }
}

/* ========== Theme ========== */
function initTheme() {
  const saved = localStorage.getItem("theme");
  const useDark = saved ? saved === "dark" : false;
  if (useDark) {
    document.documentElement.setAttribute("data-theme", "dark");
    $("#iconSun").style.display = "none";
    $("#iconMoon").style.display = "";
  } else {
    document.documentElement.setAttribute("data-theme", "light");
    $("#iconSun").style.display = "";
    $("#iconMoon").style.display = "none";
  }
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.documentElement.setAttribute("data-theme", "light");
    localStorage.setItem("theme", "light");
    $("#iconSun").style.display = "";
    $("#iconMoon").style.display = "none";
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    localStorage.setItem("theme", "dark");
    $("#iconSun").style.display = "none";
    $("#iconMoon").style.display = "";
  }
}

/* ========== Scroll Animation ========== */
function initScrollAnim() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        // Animate skill bars
        const bars = $$(".skill-bar-fill", entry.target);
        bars.forEach(b => {
          const lvl = b.getAttribute("data-level");
          if (lvl) b.style.width = lvl + "%";
        });
      }
    });
  }, { threshold: 0.15 });

  $$(".fade-in").forEach(el => observer.observe(el));
}

/* ========== Particle Background ========== */
function initParticles() {
  const canvas = $("#bgCanvas");
  const ctx = canvas.getContext("2d");
  let particles = [];
  const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const MOUSE_RADIUS = 140;
  const REPEL_RADIUS = 40;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticlesArray();
  }

  function initParticlesArray() {
    particles = [];
    const count = Math.min(45, Math.floor((canvas.width * canvas.height) / 18000));
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }
  }

  class Particle {
    constructor() {
      this.homeX = Math.random() * canvas.width;
      this.homeY = Math.random() * canvas.height;
      this.x = this.homeX;
      this.y = this.homeY;
      this.vx = (Math.random() - 0.5) * 0.18;
      this.vy = (Math.random() - 0.5) * 0.18;
      this.size = Math.random() * 1.6 + 1;
      this.baseOpacity = Math.random() * 0.18 + 0.12;
      this.hue = Math.random() * 90 + 250;
    }
    update() {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // 向原位回归的力
      const homeDx = this.homeX - this.x;
      const homeDy = this.homeY - this.y;
      const homeForce = 0.002;

      // 鼠标吸引力
      if (dist < MOUSE_RADIUS && mouse.x > 0 && dist > 0) {
        let force;
        if (dist < REPEL_RADIUS) {
          force = -(REPEL_RADIUS - dist) / REPEL_RADIUS * 0.06;
        } else {
          force = (1 - dist / MOUSE_RADIUS) * 0.05;
        }
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }

      this.vx += homeDx * homeForce;
      this.vy += homeDy * homeForce;

      // 阻尼
      this.vx *= 0.95;
      this.vy *= 0.95;

      this.x += this.vx;
      this.y += this.vy;

      // 边界反弹
      if (this.x < 0) { this.x = 0; this.vx *= -0.5; }
      if (this.x > canvas.width) { this.x = canvas.width; this.vx *= -0.5; }
      if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
      if (this.y > canvas.height) { this.y = canvas.height; this.vy *= -0.5; }
    }
    draw(ctx) {
      const d = Math.sqrt((mouse.x - this.x) ** 2 + (mouse.y - this.y) ** 2);
      const glow = (d < MOUSE_RADIUS && mouse.x > 0) ? 1 + (1 - d / MOUSE_RADIUS) * 2 : 1;
      const alpha = Math.min(1, this.baseOpacity * glow);
      const size = this.size * (1 + (glow - 1) * 0.4);

      // 光晕
      ctx.beginPath();
      ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 70%, ${isDark ? 70 : 50}%, ${alpha * 0.12})`;
      ctx.fill();

      // 核心
      ctx.beginPath();
      ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 70%, ${isDark ? 85 : 60}%, ${alpha})`;
      ctx.fill();
    }
  }

  function drawConnections(ctx) {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 90) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `hsla(${particles[i].hue}, 60%, ${isDark ? 70 : 50}%, ${0.08 * (1 - dist / 90)})`;
          ctx.lineWidth = 0.35;
          ctx.stroke();
        }
      }
      // 粒子与鼠标连线
      if (mouse.x > 0) {
        const md = Math.sqrt((mouse.x - particles[i].x) ** 2 + (mouse.y - particles[i].y) ** 2);
        if (md < MOUSE_RADIUS) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `hsla(${particles[i].hue}, 60%, ${isDark ? 85 : 60}%, ${0.10 * (1 - md / MOUSE_RADIUS)})`;
          ctx.lineWidth = 0.4;
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    mouse.x += (mouse.tx - mouse.x) * 0.1;
    mouse.y += (mouse.ty - mouse.y) * 0.1;
    particles.forEach(p => { p.update(); p.draw(ctx); });
    drawConnections(ctx);
    requestAnimationFrame(animate);
  }

  document.addEventListener("mousemove", (e) => {
    mouse.tx = e.clientX;
    mouse.ty = e.clientY;
  });
  document.addEventListener("mouseleave", () => {
    mouse.tx = -9999;
    mouse.ty = -9999;
  });
  document.addEventListener("touchmove", (e) => {
    mouse.tx = e.touches[0].clientX;
    mouse.ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", () => {
    mouse.tx = -9999;
    mouse.ty = -9999;
  });

  resize();
  animate();
  window.addEventListener("resize", resize);
}

  setTimeout(() => {
    window._skillAnimated = true;
    $$(".skill-bar-fill").forEach(b => {
      const lvl = b.getAttribute("data-level");
      if (lvl) b.style.width = lvl + "%";
    });
  }, 300);
}

document.addEventListener("DOMContentLoaded", init);

/* ===== Research-driven interactions: spotlight / 3D tilt / scroll progress ===== */
function initSpotlight() {
  const spot = document.getElementById("cursorSpotlight");
  if (!spot) return;
  if (window.matchMedia("(hover: none), (pointer: coarse)").matches) return;

  let x = window.innerWidth / 2;
  let y = window.innerHeight / 2;
  let tx = x;
  let ty = y;

  window.addEventListener("mousemove", (e) => {
    tx = e.clientX;
    ty = e.clientY;
  }, { passive: true });

  (function loop() {
    x += (tx - x) * 0.12;
    y += (ty - y) * 0.12;
    spot.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  })();
}

function initTilt() {
  const cards = $$(".highlight-card, .skill-card, .timeline-card, .cert-card");
  if (!cards.length || window.matchMedia("(hover: none), (pointer: coarse)").matches) return;

  cards.forEach((card) => {
    let raf = null;

    card.addEventListener("mousemove", (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        card.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
        card.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
        card.style.transform = `perspective(850px) rotateY(${(px * 7).toFixed(2)}deg) rotateX(${(-py * 7).toFixed(2)}deg) translateY(-4px)`;
      });
    });

    card.addEventListener("mouseleave", () => {
      if (raf) {
        cancelAnimationFrame(raf);
        raf = null;
      }
      card.style.transform = "";
    });
  });
}

function initScrollProgress() {
  const bar = document.getElementById("scrollProgress");
  if (!bar) return;

  const update = () => {
    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    const p = max > 0 ? doc.scrollTop / max : 0;
    bar.style.transform = `scaleX(${p})`;
  };

  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  update();
}

function initNavSpy() {
  const links = $$(".nav-links a");
  const sections = resume.navSections.map(s => document.getElementById(s.id)).filter(Boolean);
  if (!sections.length) return;

  function onScroll() {
    const pos = window.scrollY + 140;
    let current = sections[0] ? sections[0].id : null;
    for (const sec of sections) {
      if (sec.offsetTop <= pos) current = sec.id;
    }
    links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + current));
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}
function initHeroParallax() {
  const hero = document.getElementById("hero");
  if (!hero) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  let ticking = false;
  function update() {
    const y = window.scrollY;
    if (y < window.innerHeight * 1.2) {
      hero.style.backgroundPositionY = (y * 0.25) + "px";
    }
    ticking = false;
  }
  window.addEventListener("scroll", () => {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
  update();
}

function initHorizontalGallery() {
  const gallery = document.querySelector(".cert-images");
  if (!gallery) return;
  gallery.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      gallery.scrollLeft += e.deltaY;
    }
  }, { passive: false });
}
document.addEventListener("DOMContentLoaded", () => {
  initSpotlight();
  initTilt();
  initScrollProgress();
  initNavSpy();
  initHeroParallax();
  initHorizontalGallery();
});

/* ===== Loader v2: longer, progress, playful buttons ===== */
(function () {
  const loader = document.getElementById("loader");
  if (!loader) return;
  const bar = loader.querySelector(".loader-bar span");

  const MIN_TIME = 3200;
  const start = Date.now();
  let hidden = false;

  function hide() {
    if (hidden) return;
    hidden = true;
    const wait = Math.max(0, MIN_TIME - (Date.now() - start));
    setTimeout(() => loader.classList.add("done"), wait);
  }

  function tick() {
    const elapsed = Date.now() - start;
    const p = Math.min(100, (elapsed / MIN_TIME) * 100);
    if (bar) bar.style.width = p + "%";
    if (p < 100) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);


  if (document.readyState === "complete") {
    setTimeout(hide, MIN_TIME);
  } else {
    window.addEventListener("load", () => setTimeout(hide, MIN_TIME));
  }

  // Safety fallback
  setTimeout(hide, MIN_TIME + 900);
})();
</script>
